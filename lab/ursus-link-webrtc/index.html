<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>URSUS Link WebRTC Test Receiver</title>
<style>
body{font:15px system-ui;margin:1.25rem;max-width:46rem}textarea{display:block;width:100%;height:10rem;margin:.5rem 0}button,input{margin:.35rem .2rem .35rem 0}pre{background:#f4f4f4;padding:.75rem;white-space:pre-wrap;overflow-wrap:anywhere}

<h1>URSUS Link WebRTC Test Receiver</h1>
<p>Development test only. Wi-Fi off, LTE/5G active. This page stores no SDP and relays no file bytes; file bytes use the direct DataChannel.</p>
<input id="offer-file" type="file" accept="application/json,.json"><button id="load-offer">Load Offer JSON file</button>
<textarea id="offer" placeholder="Or paste complete Offer JSON"></textarea><button id="answer">Create complete answer</button>
<textarea id="answer-json" readonly placeholder="Answer JSON"></textarea><button id="copy-answer" disabled>Copy Answer</button><button id="save-answer" disabled>Save Answer JSON file</button>
<p id="status">Checking browser capability</p><button id="save" disabled>Download received file</button><pre id="log"></pre>
<script>
/* Self-contained SHA-256 fallback for non-WebCrypto document contexts. */
(() => {
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const r=(x,n)=>((x>>>n)|(x<<(32-n)))>>>0;
  window.ursusSha256Hex=bytes=>{const source=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes),bitLength=source.length*8,padded=new Uint8Array(Math.ceil((source.length+9)/64)*64);padded.set(source);padded[source.length]=128;const lengthView=new DataView(padded.buffer);lengthView.setUint32(padded.length-4,bitLength>>>0);lengthView.setUint32(padded.length-8,Math.floor(bitLength/0x100000000));let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;const w=new Uint32Array(64);for(let base=0;base<padded.length;base+=64){const view=new DataView(padded.buffer,base,64);for(let i=0;i<16;i++)w[i]=view.getUint32(i*4);for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^((~e)&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0}return[h0,h1,h2,h3,h4,h5,h6,h7].map(x=>x.toString(16).padStart(8,'0')).join('')};
})();
</script>
<script>
(() => {
  const $=id=>document.getElementById(id),log=value=>$('log').textContent+=`${new Date().toISOString()} ${value}\n`,stun='stun:stun.l.google.com:19302';
  const webRtcAvailable=typeof window.RTCPeerConnection==='function';
  log(`DOCUMENT_PROTOCOL ${location.protocol}`);log(`WINDOW_IS_SECURE_CONTEXT ${window.isSecureContext}`);log(`WEBRTC_AVAILABLE ${webRtcAvailable}`);log(`CRYPTO_AVAILABLE ${Boolean(window.crypto)}`);log(`CRYPTO_SUBTLE_AVAILABLE ${Boolean(window.crypto?.subtle?.digest)}`);log(`SHA_FALLBACK_AVAILABLE ${typeof window.ursusSha256Hex==='function'}`);
  if(!webRtcAvailable){$('status').textContent='WebRTC unavailable in this document context';log('WEBRTC_UNAVAILABLE');return}
  const pc=new RTCPeerConnection({iceServers:[{urls:stun}]}),LIMIT=128*1024*1024;let meta,chunks=[],received=0,seq=0,offset=0,transferComplete=false,selected=false;
  const types=sdp=>[...sdp.matchAll(/^a=candidate:.* typ (\S+)/gm)].map(match=>match[1]),show=list=>list.join(',')||'none';
  const hashBlob=async blob=>{log('HASH_START');try{if(window.crypto?.subtle?.digest){log('HASH_BACKEND webcrypto');const digest=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());log('HASH_COMPLETE');return[...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('')}log('HASH_BACKEND js-fallback');const digest=window.ursusSha256Hex(new Uint8Array(await blob.arrayBuffer()));log('HASH_COMPLETE');return digest}catch(error){log(`HASH_FAILED ${error.name||'Error'} ${error.message||''}`);return null}};
  const selectedPair=async()=>{if(selected)return;for(const item of (await pc.getStats()).values()){if(item.type!=='candidate-pair'||!item.nominated||item.state!=='succeeded')continue;const stats=await pc.getStats(),local=stats.get(item.localCandidateId),remote=stats.get(item.remoteCandidateId);log(`SELECTED_CANDIDATE_PAIR local=${local?.candidateType||'?'} remote=${remote?.candidateType||'?'}`);selected=true;return}log('SELECTED_CANDIDATE_PAIR unavailable')};
  const ack=(channel,status,reason='',sha256)=>{log(`TRANSFER_ACK_SEND_START status=${status} received_bytes=${received}`);try{if(channel.readyState!=='open')throw new Error(`channel=${channel.readyState}`);channel.send(JSON.stringify({type:'transfer-ack',status,received_bytes:received,sha256,reason}));log(`TRANSFER_ACK_SENT status=${status} received_bytes=${received}${reason?` reason=${reason}`:''}`)}catch(error){log(`TRANSFER_ACK_SEND_FAIL ${error.message}`)}};
  pc.onicegatheringstatechange=()=>{log(`ICE_GATHERING ${pc.iceGatheringState}`);if(pc.iceGatheringState==='complete'&&pc.localDescription){const found=types(pc.localDescription.sdp);log(`LOCAL_CANDIDATES ${show(found)}`);if(!found.includes('srflx'))log('NO_SRFLX_CANDIDATE')}};
  pc.oniceconnectionstatechange=async()=>{const state=pc.iceConnectionState;$('status').textContent=`ICE ${state} / peer ${pc.connectionState}`;log(`ICE_CONNECTION ${state}`);if(state==='connected'||state==='completed')await selectedPair();if(state==='failed')log(transferComplete?'CONNECTION_CLOSED_NORMAL':'DIRECT_ICE_FAILED reason=ICE_NO_VALID_PAIR');if(state==='disconnected'&&transferComplete)log('CONNECTION_CLOSED_NORMAL')};
  pc.onconnectionstatechange=()=>{log(`PEER_CONNECTION ${pc.connectionState}`);if(pc.connectionState==='failed'&&!transferComplete&&['connected','completed'].includes(pc.iceConnectionState))log('DATACHANNEL_OPEN_FAILED')};
  pc.ondatachannel=event=>{const channel=event.channel;channel.binaryType='arraybuffer';channel.onopen=()=>{log('DATA_CHANNEL_OPEN');$('status').textContent='DataChannel OPEN'};channel.onclose=()=>log(transferComplete?'CONNECTION_CLOSED_NORMAL':'RECEIVER_DISCONNECTED');channel.onmessage=async event=>{if(typeof event.data==='string'){const message=JSON.parse(event.data);if(message.type==='file-metadata'){meta=message;if(meta.size>LIMIT){log('TRANSFER_FAILED memory limit');ack(channel,'ERROR','SIZE_LIMIT');channel.close();return}chunks=[];received=0;seq=0;offset=Number(meta.resume_offset||0);log(`FILE_METADATA ${meta.name} ${meta.size}`)}else if(message.type==='transfer-end'){log('TRANSFER_END_RECEIVED');if(!meta||received!==meta.size||message.bytes!==received){log('TRANSFER_FAILED SIZE_MISMATCH');ack(channel,'ERROR','SIZE_MISMATCH');return}log('RECEIVED_BYTES_VERIFIED');log('SEQUENCE_VERIFIED');if(offset!==meta.size){log('TRANSFER_FAILED OFFSET_MISMATCH');ack(channel,'ERROR','CHUNK_GAP');return}log('OFFSET_VERIFIED');const hash=await hashBlob(new Blob(chunks));if(!hash){ack(channel,'ERROR','HASH_FAILED');return}const matched=hash===message.sha256;log(`HASH_${matched?'MATCH':'MISMATCH'} ${hash}`);if(!matched){ack(channel,'ERROR','HASH_MISMATCH',hash);return}ack(channel,'OK','',hash);transferComplete=true;log('TRANSFER_COMPLETE');$('save').disabled=false;$('save').onclick=()=>{const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(chunks));link.download=meta.name;link.click()}}return}const view=new DataView(event.data),number=Number(view.getBigUint64(0)),expected=Number(view.getBigUint64(8)),length=view.getUint32(16),payload=event.data.slice(20);if(!meta||number!==seq||expected!==offset||length!==payload.byteLength){log('TRANSFER_FAILED chunk order');ack(channel,'ERROR','CHUNK_GAP');channel.close();return}chunks.push(payload);received+=length;seq++;offset+=length;if(received===meta.size)log(`TRANSFER_PROGRESS bytes=${received}`)}};
  $('load-offer').onclick=async()=>{const file=$('offer-file').files[0];if(!file){log('OFFER_FILE_NOT_SELECTED');return}try{$('offer').value=await file.text();log(`OFFER_FILE_LOADED bytes=${file.size}`)}catch(error){log(`OFFER_FILE_READ_FAILED ${error.message}`)}};
  $('answer').onclick=async()=>{try{const offer=JSON.parse($('offer').value),description=offer.description||offer;await pc.setRemoteDescription(description);const remote=types(description.sdp);log(`REMOTE_CANDIDATES ${show(remote)}`);if(!remote.includes('srflx'))log('NO_SRFLX_CANDIDATE remote');const answer=await pc.createAnswer();await pc.setLocalDescription(answer);$('answer-json').value=JSON.stringify({type:'sdp',description:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}},null,2);$('copy-answer').disabled=false;$('save-answer').disabled=false;$('status').textContent='Answer ready; return answer JSON to PC'}catch(error){log(`SIGNALING_FAILED ${error.message}`)}};
  $('copy-answer').onclick=async()=>{try{await navigator.clipboard.writeText($('answer-json').value);log('ANSWER_COPIED')}catch(error){log(`COPY_FAILED ${error.message}`)}};
  $('save-answer').onclick=()=>{const blob=new Blob([$('answer-json').value],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='manual_answer.json';link.click();log('ANSWER_FILE_SAVED')};
  $('status').textContent='Load or paste Offer JSON';
})();
</script>
